# Postiz (오픈소스 SNS 예약 발행) - 셀프호스팅, 라이선스 무료
# 모든 값은 .env 에서 주입한다 (하드코딩 없음).
# 주의: 최신 Postiz 버전은 구성(예: Temporal)이 바뀔 수 있다.
#       배포 전 공식 docker-compose(https://docs.postiz.com/installation/docker-compose)와 대조할 것.
services:
  postiz:
    image: ${POSTIZ_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-app
    restart: unless-stopped
    environment:
      MAIN_URL: ${POSTIZ_URL}
      FRONTEND_URL: ${POSTIZ_URL}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_URL}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postiz-postgres:5432/${DB_NAME}
      REDIS_URL: redis://postiz-redis:6379
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION}
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
    env_file:
      - .env.providers   # SNS별 API 키(X_API_KEY 등). 없으면 빈 파일로 둔다.
    volumes:
      - ${DATA_DIR}/config:/config
      - ${DATA_DIR}/uploads:/uploads
    ports:
      - "${HOST_PORT}:5000"
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

  postiz-postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postiz-redis:
    image: ${REDIS_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
